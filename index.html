<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191D">
<title>Dejamu · Mantenimiento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#16191D; --muted:#5B6470; --line:#DCE0E5; --line2:#AEB5BF;
  --primary:#1D4E89; --primary-soft:#DCE8F7; --dark:#16191D;
  --at:#1B5E34; --at-soft:#DDF0E4; --ex:#8A3B00; --ex-soft:#FDE8D4; --ex-line:#F0B98A; --ne:#8E1F1F; --ne-soft:#F6DEDE;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:13px;letter-spacing:.08em}
.top button{background:none;border:0;color:#C9CED6;font-size:14px;padding:6px 0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
.pad{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--mono);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.chip.at{background:var(--at-soft);color:var(--at)} .chip.ex{background:var(--ex-soft);color:var(--ex)}
.chip.ne{background:var(--ne-soft);color:var(--ne)} .chip.gr{background:#ECEEF1;color:#3D4450}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{min-height:48px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:600;font-size:16px;cursor:pointer;padding:0 16px;width:100%}
.btn.ex{background:var(--ex)} .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}
.btn.big{min-height:52px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.sec{font-size:13px;font-weight:700;letter-spacing:.04em;margin:4px 0 -6px}
.sec.ex{color:var(--ex)} .sec.pr{color:var(--primary)} .sec.gr{color:#3D4450} .sec.at{color:var(--at)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:14px;color:var(--muted)}
.head{background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.head .code{font-size:26px}
.head .name{font-size:19px;font-weight:600}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:14px 0;border:0;background:none;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
.qband{background:var(--primary);color:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;background:#3E6DA6;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.note{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
.note.warn{background:var(--ex-soft);color:var(--ex)} .note.err{background:var(--ne-soft);color:var(--ne)} .note.info{background:#ECEEF1;color:#3D4450}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.foot .wrap{display:flex;gap:10px}
label.f{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.in{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;background:#fff;font-size:16px}
textarea.in{resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:48px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft);color:var(--primary)}
.photo{min-height:96px;border:2px dashed var(--line2);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3D4450;cursor:pointer;padding:10px;text-align:center}
.photo img{max-width:100%;max-height:220px;border-radius:8px}
.facts{background:#ECEEF1;border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.facts span{display:block;color:var(--muted)} .facts b{font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.center{text-align:center;align-items:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:s 0.9s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:20}
.hidden{display:none!important}
.chip.ju{background:#E8E3F5;color:#4B3A80}
.chip.c1{background:var(--ne-soft);color:var(--ne)}.chip.c2{background:var(--ex-soft);color:var(--ex)}.chip.c3{background:#FBF1C7;color:#6B5300}.chip.c4{background:var(--at-soft);color:var(--at)}
.efoto{height:200px;background:#DCE0E5;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden}
.efoto img{width:100%;height:100%;object-fit:cover}
.docs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.docs button{flex-shrink:0;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;cursor:pointer}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px}
.scanbtn{min-height:64px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.kpi{font-size:40px;font-weight:700;line-height:1}
.pbar{height:10px;background:#E4E7EB;border-radius:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--primary)}
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .marco{position:absolute;left:50%;top:45%;width:240px;height:240px;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.cam .bar2{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center;color:#fff;text-align:center}
.tabla{width:100%;border-collapse:collapse;font-size:14px}.tabla td,.tabla th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabla th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tabla tr.sel{cursor:pointer}.tabla tr.sel:hover{background:#F7F8FA}
select.in{appearance:auto}
.chip.mine{background:var(--primary-soft);color:var(--primary)}
.search{display:flex;gap:8px}.search .in{flex:1}.search .btn{width:auto}
.res{display:flex;flex-direction:column;gap:8px}
.res button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
<div class="top"><b>DEJAMU · MANTENIMIENTO</b><span style="display:flex;gap:18px"><button id="inicio" class="hidden" type="button">Inicio</button><button id="salir" class="hidden" type="button">Salir</button></span></div>
<main id="app" aria-live="polite"></main>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyHE0Y-nP19PfPFndNkxlsy8lmdYzcicBL4AcV4sVCK4BkGTwHbHizoDLlCwUZM7qVG/exec';
const CLIENT_ID = '22939874565-e53j3p3oar2l9tqtcbhtn8o6lecbsmq9.apps.googleusercontent.com';
const VERSION = 'v6 · 2026-11-11';

const qs = new URLSearchParams(location.search);
const S = { a: (qs.get('a') || '').trim().toUpperCase(), k: (qs.get('k') || '').trim(), token: null, tec: null, data: null,
            hv: { filtro: 'TODO', pagina: 0, items: [], total: 0 }, motivos: [] };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chip = c => c === 'AT' ? '<span class="chip at">AT · a tiempo</span>' : c === 'EX' ? '<span class="chip ex">EX · extemporánea</span>'
                 : c === 'NE' ? '<span class="chip ne">NE · no ejecutada</span>' : c === 'JU' ? '<span class="chip ju">JU · justificada</span>' : '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 4000);
}
const cacheArch = {};
async function blobDe(id) {
  if (cacheArch[id]) return cacheArch[id];
  const r = await api('archivo', { id });
  const bin = atob(r.base64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return (cacheArch[id] = URL.createObjectURL(new Blob([arr], { type: r.mime })));
}
async function abrirArchivo(id) {
  const w = window.open('', '_blank');
  try { const u = await blobDe(id); if (w) w.location = u; else location.href = u; } catch (e) { if (w) w.close(); if (!e.manejado) toast(e.message); }
}
const chipClase = c => c ? `<span class="chip ${c.toLowerCase()}">${c}</span>` : '';
function cargando(txt) { app.innerHTML = `<div class="wrap pad center"><div class="spin" aria-hidden="true"></div><span class="muted">${esc(txt || 'Cargando…')}</span></div>`; }
function setURL(a, k) {
  try { history.replaceState(null, '', location.pathname + (a ? '?a=' + encodeURIComponent(a) + (k ? '&k=' + encodeURIComponent(k) : '') : '')); } catch (e) {}
}
function barraSesion(on) {
  document.getElementById('salir').classList.toggle('hidden', !on);
  document.getElementById('inicio').classList.toggle('hidden', !on);
}

/* ---------- Sesión Google ---------- */
function jwtExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
function guardarToken(t) { S.token = t; try { localStorage.setItem('mtto_t', t); } catch (e) {} }
function tokenGuardado() { try { const t = localStorage.getItem('mtto_t'); return t && jwtExp(t) > Date.now() + 60000 ? t : null; } catch (e) { return null; } }
function salir() {
  try { localStorage.removeItem('mtto_t'); } catch (e) {}
  S.token = null; S.tec = null;
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  vistaLogin();
}
document.getElementById('salir').onclick = salir;
document.getElementById('inicio').onclick = () => { S.a = ''; S.k = ''; setURL(); vistaInicio(); };

function vistaLogin(msg) {
  barraSesion(false);
  app.innerHTML = `<div class="wrap pad">
    ${S.a ? `<div class="card" style="padding:20px"><span class="muted">Activo</span><span class="code" style="font-size:28px">${esc(S.a)}</span></div>` : ''}
    ${msg ? `<div class="note err">${esc(msg)}</div>` : ''}
    <p style="margin:0;font-size:15px;line-height:1.5">Inicia sesión con tu cuenta Google autorizada.</p>
    <div id="gbtn" style="min-height:44px;display:flex;justify-content:center"></div>
    <div class="note info">Solo técnicos registrados y activos. Cada acceso queda registrado.</div>
    <span class="muted center" style="display:block">${VERSION}</span></div>`;
  const pintar = () => {
    if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(pintar, 200);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { guardarToken(r.credential); iniciar(); },
                                    auto_select: true, cancel_on_tap_outside: false });
    google.accounts.id.renderButton(document.getElementById('gbtn'),
      { theme: 'outline', size: 'large', text: 'continue_with', shape: 'rectangular', width: 300, locale: 'es' });
    google.accounts.id.prompt();
  };
  pintar();
}

function vistaDenegado(msg) {
  barraSesion(false);
  app.innerHTML = `<div class="wrap pad center" style="padding-top:48px">
    <div style="width:72px;height:72px;border-radius:36px;background:var(--ne-soft);display:flex;align-items:center;justify-content:center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8E1F1F" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 style="font-size:22px;margin:0">Acceso no autorizado</h1>
    <p style="margin:0;color:#3D4450;line-height:1.5">${esc(msg)}</p>
    <p class="muted" style="line-height:1.5;margin:0">Si debes tener acceso, pide al Gestor de Desarrollo que te agregue a la lista de técnicos autorizados.</p>
    <button class="btn ghost" type="button" id="otra">Usar otra cuenta</button></div>`;
  document.getElementById('otra').onclick = salir;
}

/* ---------- API ---------- */
async function api(accion, datos) {
  const body = JSON.stringify(Object.assign({ accion, idToken: S.token, a: S.a, k: S.k }, datos || {}));
  let res;
  const aviso = setTimeout(() => toast('El servidor está tardando más de lo normal…'), 10000);
  try {
    for (let intento = 0; intento < 2; intento++) {
      const ctl = new AbortController(), tmo = setTimeout(() => ctl.abort(), 45000);
      try { res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctl.signal }); break; }
      catch (e) {
        if (intento === 1) throw new Error(e.name === 'AbortError' ? 'El servidor no respondió a tiempo. Intenta de nuevo.'
                                                               : 'No se pudo conectar con el servidor. Revisa la conexión e intenta de nuevo.');
        await new Promise(r => setTimeout(r, 1500));
      } finally { clearTimeout(tmo); }
    }
  } finally { clearTimeout(aviso); }
  const j = await res.json();
  if (!j.ok) {
    if (j.code === 'NO_AUTORIZADO') {
      if (/no está autorizada/.test(j.error)) vistaDenegado(j.error);
      else { try { localStorage.removeItem('mtto_t'); } catch (e) {} vistaLogin('Tu sesión venció. Inicia sesión de nuevo.'); }
      throw Object.assign(new Error(j.error), { manejado: true });
    }
    throw new Error(j.error || 'Error del servidor');
  }
  return j;
}

async function iniciar() {
  cargando('Verificando acceso…');
  try {
    const s = await api('sesion');
    S.tec = s.tecnico;
    barraSesion(true);
    if (S.a) await cargarActivo(); else vistaInicio();
  } catch (e) { if (!e.manejado) vistaError(e.message); }
}
function vistaError(msg) {
  app.innerHTML = `<div class="wrap pad"><div class="note err">${esc(msg)}</div>
    <button class="btn" type="button" onclick="location.reload()">Reintentar</button></div>`;
}

/* ---------- Inicio ---------- */
async function vistaInicio() {
  app.innerHTML = `<div class="wrap pad">
    <span class="muted">Hola, <b>${esc(S.tec.nombre)}</b> · ${esc(S.tec.rol)}</span>
    <button type="button" class="btn scanbtn" id="scan">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
      Escanear código QR</button>
    ${S.tec.permisos.gestionar || S.tec.permisos.anular ? `<a class="btn outline" href="./gestion.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Gestión: equipos, planes, asignación y criticidad</a>` : ''}
    <div id="avanceCard" class="card"><span class="muted">Cargando tu avance…</span></div>
    <div id="misTareas" style="display:flex;flex-direction:column;gap:10px"></div>
    ${buscadorHTML()}
    <span class="muted center" style="display:block">${VERSION}</span></div>`;
  document.getElementById('scan').onclick = abrirEscaner;
  activarBuscador();
  try {
    const r = await api('avance');
    S.motivos = r.motivos || []; S.qAct = r.quincena.etiqueta;
    const m = r.mio;
    document.getElementById('avanceCard').innerHTML = `
      <div class="row"><span class="sec pr" style="margin:0">Mi avance · ${esc(r.quincena.etiqueta)}</span><span class="muted">${esc(r.quincena.inicio)} a ${esc(r.quincena.fin)}</span></div>
      <div class="row" style="align-items:flex-end"><span class="kpi">${m.pct}%</span><span class="muted">${m.hechas} de ${m.total} tareas asignadas</span></div>
      <div class="pbar"><i style="width:${m.pct}%"></i></div>
      ${m.vencidas.length ? `<span style="font-size:13px;color:var(--ex)">${m.vencidas.length} tarea(s) vencidas de quincenas anteriores aún subsanables</span>` : ''}
      <button type="button" class="btn outline" id="verAv">${r.equipo ? 'Ver avance del equipo y tareas hechas' : 'Ver tareas hechas'}</button>`;
    document.getElementById('verAv').onclick = () => vistaAvance(r);
    const pend = m.vencidas.concat(m.items.filter(t => !t.hecha));
    document.getElementById('misTareas').innerHTML = `<span class="sec pr">Mis tareas pendientes (${pend.length})</span>` + (pend.length ? listaEjecutable(pend) : '<div class="empty">No tienes tareas pendientes asignadas en esta quincena.</div>');
    document.querySelectorAll('[data-ej]').forEach(b => b.onclick = () => ejecutarTarea(b.dataset.act, b.dataset.ej));
  } catch (e) {
    if (!e.manejado) document.getElementById('avanceCard').innerHTML = `<span class="muted">No se pudo cargar el avance: ${esc(e.message)}</span>`;
  }
}

function listaEjecutable(items) {
  const por = {}, ord = c => ({ C1: 1, C2: 2, C3: 3, C4: 4 }[c] || 5);
  items.forEach(t => (por[t.activo] = por[t.activo] || []).push(t));
  return Object.keys(por).sort((x, y) => ord(por[x][0].clase) - ord(por[y][0].clase) || x.localeCompare(y)).map(cod => {
    const ts = por[cod];
    return `<div class="card"><div><span class="code">${esc(cod)}</span> <span style="font-weight:600">${esc(ts[0].nombreActivo)}</span> ${chipClase(ts[0].clase)}</div>
      ${ts.map(t => `<div style="border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px">
        <div class="row"><span class="code" style="font-size:13px">${esc(t.codigo)}</span>${t.quincena !== S.qAct ? '<span class="chip ex">Vencida</span>' : ''}</div>
        <span style="font-size:14px">${esc(t.descripcion)}</span>
        <span class="muted">${esc(t.frecuencia)}${t.vence ? ' · vence ' + esc(t.vence) : ''}</span>
        ${t.justificacion ? `<span style="font-size:13px;color:#4B3A80">Justificada: ${esc(t.justificacion)}</span>` : ''}
        <button type="button" class="btn" style="min-height:42px" data-ej="${esc(t.codigo)}" data-act="${esc(cod)}">Ejecutar</button></div>`).join('')}</div>`;
  }).join('');
}
function ejecutarTarea(cod, codigo) {
  S.a = cod; S.k = ''; S.pendienteCodigo = codigo; S.hv = { filtro: 'TODO', pagina: 0, items: [], total: 0 };
  setURL(cod); cargarActivo();
}

/* ---------- Avance ---------- */
function listaTareasAvance(items, mostrarHechas) {
  const porActivo = {};
  items.forEach(t => (porActivo[t.activo] = porActivo[t.activo] || []).push(t));
  const ord = c => ({ C1: 1, C2: 2, C3: 3, C4: 4 }[c] || 5);
  return Object.keys(porActivo).sort((x, y) => ord(porActivo[x][0].clase) - ord(porActivo[y][0].clase) || x.localeCompare(y)).map(cod => {
    const ts = porActivo[cod];

/* ---------- Escáner QR ---------- */
let camStream = null, camLoop = null;
async function abrirEscaner() {
  const ov = document.createElement('div');
  ov.className = 'cam';
  ov.innerHTML = `<video id="vid" playsinline muted></video><div class="marco" aria-hidden="true"></div>
    <div class="bar2"><span id="camMsg">Apunta al código QR del equipo</span>
    <button type="button" class="btn ghost" id="camX" style="max-width:320px">Cancelar</button></div>`;
  document.body.appendChild(ov);
  const cerrar = () => { cancelAnimationFrame(camLoop); if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; ov.remove(); };
  document.getElementById('camX').onclick = cerrar;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    document.getElementById('camMsg').textContent = 'No se pudo abrir la cámara. Revisa el permiso de cámara del navegador.';
    return;
  }
  const v = document.getElementById('vid');
  v.srcObject = camStream; await v.play();
  let detectar;
  if ('BarcodeDetector' in window) {
    const bd = new BarcodeDetector({ formats: ['qr_code'] });
    detectar = async () => { const r = await bd.detect(v); return r[0] && r[0].rawValue; };
  } else {
    await cargarJsQR();
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    detectar = async () => {
      if (!v.videoWidth) return null;
      c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
      const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
      return r && r.data;
    };
  }
  const paso = async () => {
    if (!camStream) return;
    try {
      const txt = await detectar();
      if (txt && procesarQR(txt)) { cerrar(); return; }
      if (txt) document.getElementById('camMsg').textContent = 'Ese QR no es de un equipo Dejamu';
    } catch (e) {}
    camLoop = requestAnimationFrame(paso);
  };
  paso();
}
function cargarJsQR() {
  return new Promise((ok, mal) => {
    if (window.jsQR) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload = ok; s.onerror = mal; document.head.appendChild(s);
  });
}
function procesarQR(txt) {
  let a = '', k = '';
  try { const u = new URL(txt); a = (u.searchParams.get('a') || '').toUpperCase(); k = u.searchParams.get('k') || ''; }
  catch (e) { if (/^[EAM]\s*\d{1,4}$/i.test(txt.trim())) a = txt.trim().toUpperCase(); }
  if (!a) return false;
  if (navigator.vibrate) navigator.vibrate(80);
  S.a = a; S.k = k; S.hv = { filtro: 'TODO', pagina: 0, items: [], total: 0 };
  setURL(a, k); cargarActivo();
  return true;
}

  F = { codigo, tarea: t, foto: null, operativo: 'SI' };
  const ex = t && t.vencida;
  app.innerHTML = `<div class="head"><div class="row"><button type="button" class="btn ghost" style="width:auto;min-height:40px" onclick="vistaActivo()">← Volver</button>
      <span class="code">${esc(d.activo.codigo)}</span></div></div>
  <div class="wrap pad">
    ${t ? `<div class="card" ${ex ? 'style="border-color:var(--ex-line)"' : ''}><div class="row"><span class="code" style="font-size:18px">${esc(t.codigo)}</span>
        ${ex ? '<span class="chip ex">EX</span>' : ''}</div>
      <span style="font-size:15px;font-weight:500">${esc(t.descripcion)}</span>
      ${ex ? `<span style="font-size:13px;color:var(--ex)">Vencida. Se registrará como extemporánea (subsanada).</span>` : ''}</div>`
      : `<div class="card"><span class="code" style="font-size:18px">Correctivo · código 1</span><span class="muted">${esc(d.activo.nombre)}</span></div>`}
    <div class="facts"><div><span>Tipo</span><b>${t ? 'Preventivo' : 'Correctivo'}</b></div>
      <div><span>Técnico (verificado)</span><b>${esc(S.tec.nombre)}</b></div>
      <div><span>Activo</span><b>${esc(d.activo.codigo)}</b></div>
      <div><span>Fecha y hora</span><b>Las asigna el servidor</b></div></div>
    <div><label class="f" for="desc">${t ? 'Actividades ejecutadas' : 'Falla encontrada y trabajo realizado'} *</label>
      <textarea id="desc" class="in" rows="4" placeholder="Describe lo que hiciste"></textarea></div>
    <div><label class="f" for="min">Tiempo empleado (minutos) *</label>
      <input id="min" class="in" type="number" inputmode="numeric" min="1" max="1439" placeholder="0"></div>
    <div><span class="f">Foto de evidencia ${!t ? '*' : '(opcional)'}</span>
      <label class="photo" for="foto" id="fotoBox"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D4450" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Tomar foto o elegir de galería</label>
      <input id="foto" type="file" accept="image/*" capture="environment" class="hidden"></div>
    <div><span class="f">¿El ${d.activo.tipo === 'AREA' ? 'área' : 'equipo'} queda en condiciones de operar? *</span>
      <div class="seg"><button type="button" aria-pressed="true" data-op="SI">Sí</button><button type="button" aria-pressed="false" data-op="NO">No</button></div></div>
    <div><label class="f" for="pend">Actividades pendientes</label><input id="pend" class="in" placeholder="Ninguna"></div>
    <div><label class="f" for="rep">Repuesto usado (referencia)</label><input id="rep" class="in" placeholder="Opcional"></div>
    <div><label class="f" for="con">Contratista</label><input id="con" class="in" placeholder="Solo si aplica">
      <span class="muted" style="display:block;margin-top:4px">Si hubo contratista, el supervisor deberá cargar su informe (PDF) en el sistema.</span></div>
    <div id="ferr" class="note err hidden" role="alert"></div>
  </div>
  <div class="foot"><div class="wrap"><button type="button" class="btn ghost" onclick="vistaActivo()">Cancelar</button>
    <button type="button" class="btn" id="guardar">Guardar registro</button></div></div>`;
  app.querySelectorAll('[data-op]').forEach(b => b.onclick = () => {
    F.operativo = b.dataset.op;
    app.querySelectorAll('[data-op]').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  document.getElementById('foto').onchange = e => comprimir(e.target.files[0]);
  document.getElementById('guardar').onclick = guardar;
  window.scrollTo(0, 0);
}
function comprimir(file) {
  if (!file) return;
  const box = document.getElementById('fotoBox');
  box.innerHTML = '<span class="muted">Procesando foto…</span>';
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    F.foto = c.toDataURL('image/jpeg', 0.8);
    URL.revokeObjectURL(url);
    box.innerHTML = `<img src="${F.foto}" alt="Foto de evidencia seleccionada"><span class="muted">Toca para cambiarla</span>`;
  };
  img.onerror = () => { box.innerHTML = '<span class="muted">No se pudo leer la imagen. Intenta con otra.</span>'; };
  img.src = url;
}
async function guardar() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('ferr'), btn = document.getElementById('guardar');
  const fallo = m => { err.textContent = m; err.classList.remove('hidden'); err.scrollIntoView({ block: 'center' }); };
  const desc = v('desc'), min = parseInt(v('min'), 10);
  if (desc.length < 5) return fallo('Describe las actividades ejecutadas.');
  if (!(min > 0 && min < 1440)) return fallo('Indica el tiempo en minutos.');
  if (!F.tarea && !F.foto) return fallo('La foto de evidencia es obligatoria en correctivos.');
  err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const r = await api('registrar', { tipo: F.tarea ? 'PREVENTIVO' : 'CORRECTIVO', codigo: F.codigo, descripcion: desc,
      tiempoMin: min, operativo: F.operativo, pendientes: v('pend'), repuesto: v('rep'), contratista: v('con'), foto: F.foto });
    toast('Registro guardado: ' + r.codigo + (r.cumplimiento ? ' · ' + r.cumplimiento : ''));
    S.hv.items = [];
    await cargarActivo();
  } catch (e) {
    if (e.manejado) return;
    btn.disabled = false; btn.textContent = 'Guardar registro';
    fallo(e.message);
  }
}

/* ---------- Justificar no ejecución ---------- */
async function abrirJustificar(codigo) {
  const t = tareaPorCodigo(codigo);
  if (!S.motivos.length) { try { S.motivos = (await api('avance')).motivos || []; } catch (e) { if (e.manejado) return; } }
  app.innerHTML = `<div class="head"><div class="row"><button type="button" class="btn ghost" style="width:auto;min-height:40px" onclick="vistaActivo()">← Volver</button>
      <span class="code">${esc(S.data.activo.codigo)}</span></div></div>
  <div class="wrap pad">
    <div class="card"><span class="code" style="font-size:18px">${esc(t.codigo)}</span>
      <span style="font-size:15px;font-weight:500">${esc(t.descripcion)}</span>
      <span class="muted">La tarea seguirá pendiente: podrás ejecutarla después. En los indicadores contará como justificada (JU).</span></div>
    <div><label class="f" for="mot">Motivo *</label>
      <select id="mot" class="in"><option value="">Selecciona…</option>${S.motivos.map(m => `<option>${esc(m)}</option>`).join('')}</select></div>
    <div><label class="f" for="obs">Explicación *</label><textarea id="obs" class="in" rows="3" placeholder="Qué pasó y qué se necesita para ejecutarla"></textarea></div>
    <div id="jerr" class="note err hidden" role="alert"></div>
  </div>
  <div class="foot"><div class="wrap"><button type="button" class="btn ghost" onclick="vistaActivo()">Cancelar</button>
    <button type="button" class="btn" id="jok">Guardar justificación</button></div></div>`;
  document.getElementById('jok').onclick = async () => {
    const mot = document.getElementById('mot').value, obs = document.getElementById('obs').value.trim();
    const err = document.getElementById('jerr'), btn = document.getElementById('jok');
    if (!mot) { err.textContent = 'Selecciona un motivo.'; return err.classList.remove('hidden'); }
    if (obs.length < 5) { err.textContent = 'Explica brevemente por qué no se ejecutó.'; return err.classList.remove('hidden'); }
    btn.disabled = true; btn.textContent = 'Guardando…';
    try { await api('justificar', { codigo, motivo: mot, observacion: obs }); toast('Justificación guardada: ' + codigo); await cargarActivo(); }
    catch (e) { if (e.manejado) return; btn.disabled = false; btn.textContent = 'Guardar justificación'; err.textContent = e.message; err.classList.remove('hidden'); }
  };
  window.scrollTo(0, 0);
}

/* ---------- Hoja de vida ---------- */
async function abrirHojaVida(reset) {
  if (reset !== false) S.hv = { filtro: S.hv.filtro || 'TODO', pagina: 0, items: [], total: 0 };
  if (!S.hv.items.length) cargando('Cargando hoja de vida…');
  try {
    const r = await api('hojaVida', { filtro: S.hv.filtro, pagina: S.hv.pagina });
    S.hv.items = S.hv.items.concat(r.items); S.hv.total = r.total;
    vistaHojaVida();
  } catch (e) { if (!e.manejado) vistaError(e.message); }
}
function vistaHojaVida() {
  const fil = [['TODO', 'Todo'], ['PREVENTIVOS', 'Preventivos'], ['CORRECTIVOS', 'Correctivos'], ['NE', 'No ejecutadas']];
  let mes = '';
  const lista = S.hv.items.map(x => {
    const m = (x.fecha || '').slice(0, 7);
    const sep = m && m !== mes ? `<span class="sec gr">${esc(nombreMes(m))}</span>` : '';
    mes = m || mes;
    const anul = x.estado === 'ANULADO';
    return sep + `<div class="card" ${anul ? 'style="opacity:.55"' : ''}>
      <div class="row"><span class="code" style="font-size:13px">${esc(x.codigo || (/(correct)/i.test(x.tipo) ? '1 · correctivo' : '—'))}</span>
        ${anul ? '<span class="chip gr">Anulado</span>' : chip(x.cumplimiento) || (x.origen === 'historico' ? '<span class="chip gr">Histórico</span>' : '')}</div>
      <span style="font-size:14px;font-weight:500">${esc(x.descripcion)}</span>
      <span class="muted">${esc(x.fecha)} · ${esc(x.tecnico || '—')} · ${esc(x.tipo || '')}</span>
      ${x.foto && /^https:\/\//.test(x.foto) ? `<a href="${esc(x.foto)}" target="_blank" rel="noopener" style="font-size:14px">Ver foto</a>` : ''}</div>`;
  }).join('');
  app.innerHTML = cabecera('h') + `<div class="wrap pad">
    <div class="filters" role="group" aria-label="Filtrar registros">${fil.map(([k, t]) =>
      `<button type="button" aria-pressed="${S.hv.filtro === k}" onclick="S.hv.filtro='${k}';abrirHojaVida()">${t}</button>`).join('')}</div>
    <span class="muted">${S.hv.total} registros</span>
    ${lista || '<div class="empty">No hay registros con este filtro.</div>'}
    ${S.hv.items.length < S.hv.total ? `<button type="button" class="btn outline" onclick="S.hv.pagina++;abrirHojaVida(false)">Cargar más</button>` : ''}
  </div>`;
}
function nombreMes(ym) {
  const [y, m] = ym.split('-').map(Number);
  const n = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][m - 1];
  return n ? n.charAt(0).toUpperCase() + n.slice(1) + ' ' + y : ym;
}

/* ---------- Arranque ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
(function () {
  const t = tokenGuardado();
  if (t) { S.token = t; iniciar(); } else vistaLogin();
})();
</script>
